name: Daily Finance News

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Crawl yesterday finance news
        env:
          TZ: Asia/Shanghai
        run: |
          YESTERDAY=$(python -c "from datetime import date, timedelta; print((date.today() - timedelta(days=1)).isoformat())")
          python finance_crawler.py --date "$YESTERDAY" --full
          python generate_md.py --date "$YESTERDAY"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data daily
          git commit -m "chore: update finance news $(date +%F)" || echo "nothing to commit"
          git push
